name: Release

on:
  push:
    branches: [master]
    paths:
      - 'src/CodexProjectLauncher/CodexProjectLauncher.csproj'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/CodexProjectLauncher/CodexProjectLauncher.csproj'
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version is missing from CodexProjectLauncher.csproj' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check whether release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:RELEASE_TAG already exists; nothing to do."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            $global:LASTEXITCODE = 0
          }

      - name: Restore Windows x64 runtime
        if: steps.existing.outputs.exists != 'true'
        run: dotnet restore src/CodexProjectLauncher/CodexProjectLauncher.csproj -r win-x64

      - name: Publish self-contained Windows x64 app
        if: steps.existing.outputs.exists != 'true'
        run: >-
          dotnet publish src/CodexProjectLauncher/CodexProjectLauncher.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Package release assets
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item 'publish/CodexProjectLauncher.exe' 'release/CodexProjectLauncher.exe'
          $zip = "release/CodexProjectLauncher-$env:RELEASE_TAG-win-x64.zip"
          Compress-Archive -Path 'publish/*' -DestinationPath $zip -Force
          $assets = @('release/CodexProjectLauncher.exe', $zip)
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path $asset -Leaf
            "$hash  $name"
          }
          $lines | Set-Content 'release/SHA256SUMS.txt'

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $zip = "release/CodexProjectLauncher-$env:RELEASE_TAG-win-x64.zip"
          gh release create $env:RELEASE_TAG 'release/CodexProjectLauncher.exe' $zip 'release/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Codex Project Launcher $env:RELEASE_TAG" --notes-file 'RELEASE_NOTES.md' --latest
